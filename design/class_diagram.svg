<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial, sans-serif" fill="#1f201d"><text x="40" y="42" font-size="25" font-weight="600">Class diagram</text><text x="40" y="68" font-size="13" font-weight="400">Model and form classes, with view/template dependencies shown separately.</text><path d="M40,88 L1060,88" fill="none" stroke="#636361"/><text x="40" y="730" font-size="11" font-weight="400">Vusi Sithole | VS26060020556 | Sticky Notes</text><rect x="40" y="130" width="300" height="245" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="54" y="155" font-size="13" font-weight="600">Note : models.Model</text><text x="54" y="176" font-size="13" font-weight="400">+ id: BigAutoField (primary key)</text><text x="54" y="197" font-size="13" font-weight="400">+ title: CharField(120)</text><text x="54" y="218" font-size="13" font-weight="400">+ content: TextField (max 10000)</text><text x="54" y="239" font-size="13" font-weight="400">+ created_at: DateTimeField</text><text x="54" y="260" font-size="13" font-weight="400">+ updated_at: DateTimeField</text><text x="54" y="281" font-size="13" font-weight="400">+ __str__(): title</text><text x="54" y="302" font-size="13" font-weight="400">+ get_absolute_url(): detail URL</text><text x="54" y="323" font-size="13" font-weight="400">Meta: newest edited first</text><path d="M40,165 L340,165" fill="none" stroke="#636361"/><rect x="430" y="130" width="300" height="200" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="444" y="155" font-size="13" font-weight="600">NoteForm : forms.ModelForm</text><text x="444" y="176" font-size="13" font-weight="400">+ Meta.model = Note</text><text x="444" y="197" font-size="13" font-weight="400">+ fields = [title, content]</text><text x="444" y="218" font-size="13" font-weight="400">+ __init__(): accessible widgets</text><text x="444" y="239" font-size="13" font-weight="400">+ is_valid() [inherited]</text><text x="444" y="260" font-size="13" font-weight="400">+ save() [inherited]</text><text x="444" y="281" font-size="13" font-weight="400">Required fields; stripped text</text><path d="M430,165 L730,165" fill="none" stroke="#636361"/><path d="M430,235 L340,235" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M340,235 L348.1040239211741,231.08531019299892" fill="none" stroke="#636361"/><path d="M340,235 L348.1040239211741,238.91468980700108" fill="none" stroke="#636361"/><text x="350" y="221" font-size="12" font-weight="400">uses</text><rect x="800" y="130" width="260" height="155" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="814" y="155" font-size="13" font-weight="600">Django ORM / SQLite</text><text x="814" y="176" font-size="13" font-weight="400">Note.objects.all()</text><text x="814" y="197" font-size="13" font-weight="400">get_object_or_404(Note, pk)</text><text x="814" y="218" font-size="13" font-weight="400">Model.save() / delete()</text><text x="814" y="239" font-size="13" font-weight="400">Persists note rows</text><path d="M800,165 L1060,165" fill="none" stroke="#636361"/><path d="M340,355 L780,355" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M780,355 L780,210" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M780,210 L800,210" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M800,210 L791.8959760788259,213.91468980700108" fill="none" stroke="#636361"/><path d="M800,210 L791.8959760788259,206.08531019299892" fill="none" stroke="#636361"/><text x="550" y="347" font-size="12" font-weight="400">managed through</text><rect x="40" y="435" width="430" height="225" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="54" y="460" font-size="13" font-weight="600">views.py [module, not a class]</text><text x="54" y="481" font-size="13" font-weight="400">note_list(request) / note_detail(request, pk)</text><text x="54" y="502" font-size="13" font-weight="400">note_create(request) / note_update(request, pk)</text><text x="54" y="523" font-size="13" font-weight="400">note_delete(request, pk)</text><text x="54" y="544" font-size="13" font-weight="400">Validates POST through NoteForm</text><text x="54" y="565" font-size="13" font-weight="400">Queries Note; renders or redirects</text><text x="54" y="586" font-size="13" font-weight="400">GET delete confirms; POST delete removes</text><path d="M40,470 L470,470" fill="none" stroke="#636361"/><path d="M240,435 L240,375" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M240,375 L243.91468980700108,383.1040239211741" fill="none" stroke="#636361"/><path d="M240,375 L236.08531019299892,383.1040239211741" fill="none" stroke="#636361"/><path d="M470,465 L580,465" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M580,465 L580,330" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M580,330 L583.9146898070011,338.1040239211741" fill="none" stroke="#636361"/><path d="M580,330 L576.0853101929989,338.1040239211741" fill="none" stroke="#636361"/><rect x="730" y="435" width="330" height="200" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="744" y="460" font-size="13" font-weight="600">Templates [presentation]</text><text x="744" y="481" font-size="13" font-weight="400">base.html: shared navigation + CSS</text><text x="744" y="502" font-size="13" font-weight="400">note_list.html / note_detail.html</text><text x="744" y="523" font-size="13" font-weight="400">note_form.html: create and edit</text><text x="744" y="544" font-size="13" font-weight="400">note_confirm_delete.html</text><text x="744" y="565" font-size="13" font-weight="400">CSRF tokens; escaped note text</text><path d="M730,470 L1060,470" fill="none" stroke="#636361"/><path d="M470,580 L730,580" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M730,580 L721.8959760788259,583.9146898070011" fill="none" stroke="#636361"/><path d="M730,580 L721.8959760788259,576.0853101929989" fill="none" stroke="#636361"/><text x="515" y="568" font-size="12" font-weight="400">renders</text><text x="40" y="698" font-size="12" font-weight="400">Dashed arrows indicate dependencies; inheritance is named in the class headings.</text></g></svg>