<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial, sans-serif" fill="#1f201d"><text x="40" y="42" font-size="25" font-weight="600">Sequence diagram</text><text x="40" y="68" font-size="13" font-weight="400">Create-note happy path, validation failure and deletion safety.</text><path d="M40,88 L1060,88" fill="none" stroke="#636361"/><text x="40" y="730" font-size="11" font-weight="400">Vusi Sithole | VS26060020556 | Sticky Notes</text><rect x="25" y="110" width="150" height="45" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="39" y="135" font-size="13" font-weight="600">User/browser</text><path d="M100,155 L100,565" fill="none" stroke="#636361" stroke-dasharray="5 4"/><rect x="240" y="110" width="150" height="45" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="254" y="135" font-size="13" font-weight="600">URL + view</text><path d="M315,155 L315,565" fill="none" stroke="#636361" stroke-dasharray="5 4"/><rect x="460" y="110" width="150" height="45" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="474" y="135" font-size="13" font-weight="600">NoteForm</text><path d="M535,155 L535,565" fill="none" stroke="#636361" stroke-dasharray="5 4"/><rect x="680" y="110" width="150" height="45" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="694" y="135" font-size="13" font-weight="600">Note / ORM</text><path d="M755,155 L755,565" fill="none" stroke="#636361" stroke-dasharray="5 4"/><rect x="900" y="110" width="150" height="45" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="914" y="135" font-size="13" font-weight="600">SQLite</text><path d="M975,155 L975,565" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M100,185 L315,185" fill="none" stroke="#636361"/><path d="M315,185 L306.8959760788259,188.91468980700108" fill="none" stroke="#636361"/><path d="M315,185 L306.8959760788259,181.08531019299892" fill="none" stroke="#636361"/><text x="108" y="177" font-size="12" font-weight="400">GET /notes/new/</text><path d="M315,225 L535,225" fill="none" stroke="#636361"/><path d="M535,225 L526.8959760788259,228.91468980700108" fill="none" stroke="#636361"/><path d="M535,225 L526.8959760788259,221.08531019299892" fill="none" stroke="#636361"/><text x="323" y="217" font-size="12" font-weight="400">Build empty form</text><path d="M315,265 L100,265" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M100,265 L108.10402392117409,261.0853101929989" fill="none" stroke="#636361"/><path d="M100,265 L108.10402392117409,268.9146898070011" fill="none" stroke="#636361"/><text x="108" y="257" font-size="12" font-weight="400">200 form + CSRF token</text><path d="M100,305 L315,305" fill="none" stroke="#636361"/><path d="M315,305 L306.8959760788259,308.9146898070011" fill="none" stroke="#636361"/><path d="M315,305 L306.8959760788259,301.0853101929989" fill="none" stroke="#636361"/><text x="108" y="297" font-size="12" font-weight="400">POST title, content, token</text><path d="M315,345 L535,345" fill="none" stroke="#636361"/><path d="M535,345 L526.8959760788259,348.9146898070011" fill="none" stroke="#636361"/><path d="M535,345 L526.8959760788259,341.0853101929989" fill="none" stroke="#636361"/><text x="323" y="337" font-size="12" font-weight="400">Bind input; is_valid()</text><path d="M535,385 L755,385" fill="none" stroke="#636361"/><path d="M755,385 L746.8959760788259,388.9146898070011" fill="none" stroke="#636361"/><path d="M755,385 L746.8959760788259,381.0853101929989" fill="none" stroke="#636361"/><text x="543" y="377" font-size="12" font-weight="400">Valid: save()</text><path d="M755,425 L975,425" fill="none" stroke="#636361"/><path d="M975,425 L966.8959760788259,428.9146898070011" fill="none" stroke="#636361"/><path d="M975,425 L966.8959760788259,421.0853101929989" fill="none" stroke="#636361"/><text x="763" y="417" font-size="12" font-weight="400">INSERT note</text><path d="M975,465 L755,465" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M755,465 L763.1040239211741,461.0853101929989" fill="none" stroke="#636361"/><path d="M755,465 L763.1040239211741,468.9146898070011" fill="none" stroke="#636361"/><text x="763" y="457" font-size="12" font-weight="400">Saved primary key</text><path d="M315,505 L100,505" fill="none" stroke="#636361" stroke-dasharray="5 4"/><path d="M100,505 L108.10402392117409,501.0853101929989" fill="none" stroke="#636361"/><path d="M100,505 L108.10402392117409,508.9146898070011" fill="none" stroke="#636361"/><text x="108" y="497" font-size="12" font-weight="400">302 detail URL + message</text><path d="M100,545 L315,545" fill="none" stroke="#636361"/><path d="M315,545 L306.8959760788259,548.9146898070011" fill="none" stroke="#636361"/><path d="M315,545 L306.8959760788259,541.0853101929989" fill="none" stroke="#636361"/><text x="108" y="537" font-size="12" font-weight="400">GET detail -&gt; 200 note</text><rect x="40" y="595" width="1020" height="100" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="54" y="620" font-size="13" font-weight="600">Alternative and safety paths</text><text x="54" y="641" font-size="13" font-weight="400">Invalid form: return 200 with field errors; no INSERT or redirect. Missing note: 404.</text><text x="54" y="662" font-size="13" font-weight="400">Delete: GET renders confirmation only. A valid CSRF-protected POST deletes, then redirects.</text><text x="54" y="683" font-size="13" font-weight="400">Middleware rejects missing/invalid CSRF tokens before a write reaches the view.</text><path d="M40,630 L1060,630" fill="none" stroke="#636361"/></g></svg>