<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="white"/><g font-family="Arial, sans-serif" fill="#1f201d"><text x="40" y="42" font-size="25" font-weight="600">Use case diagram</text><text x="40" y="68" font-size="13" font-weight="400">A local user manages notes through the Sticky Notes application.</text><path d="M40,88 L1060,88" fill="none" stroke="#636361"/><text x="40" y="730" font-size="11" font-weight="400">Vusi Sithole | VS26060020556 | Sticky Notes</text><rect x="320" y="115" width="720" height="535" rx="4" fill="#f3f6f5" stroke="#b9c8c1"/><text x="334" y="140" font-size="13" font-weight="600">Sticky Notes system</text><ellipse cx="139.0" cy="289.0" rx="19.0" ry="19.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="144" y="294.0" font-size="14" font-weight="400"></text><path d="M139,308 L139,382" fill="none" stroke="#636361"/><path d="M105,330 L174,330" fill="none" stroke="#636361"/><path d="M139,382 L110,420" fill="none" stroke="#636361"/><path d="M139,382 L168,420" fill="none" stroke="#636361"/><text x="100" y="447" font-size="14" font-weight="600">Local user</text><ellipse cx="630.0" cy="199.0" rx="150.0" ry="29.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="504" y="204.0" font-size="14" font-weight="400">List notes</text><path d="M174,330 L480,199" fill="none" stroke="#636361"/><ellipse cx="630.0" cy="284.0" rx="150.0" ry="29.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="504" y="289.0" font-size="14" font-weight="400">Read a note</text><path d="M174,330 L480,284" fill="none" stroke="#636361"/><ellipse cx="630.0" cy="369.0" rx="150.0" ry="29.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="504" y="374.0" font-size="14" font-weight="400">Create a note</text><path d="M174,330 L480,369" fill="none" stroke="#636361"/><ellipse cx="630.0" cy="454.0" rx="150.0" ry="29.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="504" y="459.0" font-size="14" font-weight="400">Update a note</text><path d="M174,330 L480,454" fill="none" stroke="#636361"/><ellipse cx="630.0" cy="539.0" rx="150.0" ry="29.0" fill="#f3f6f5" stroke="#b9c8c1"/><text x="504" y="544.0" font-size="14" font-weight="400">Delete a note</text><path d="M174,330 L480,539" fill="none" stroke="#636361"/><text x="350" y="605" font-size="13" font-weight="400">Create/update require a valid title and content. Delete requires confirmation.</text><text x="40" y="690" font-size="13" font-weight="400">Scope: one shared local board; no login, ownership or public hosting is claimed.</text></g></svg>